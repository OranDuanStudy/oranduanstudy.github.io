<!-- ========================================
     简历下载组件 - Resume Component
     使用方法: 将此代码复制到页面的主要内容区
     ======================================== -->

<section class="resume-section" id="resume">
    <div class="container">
        <div class="section-header">
            <h2>简历下载</h2>
            <p>Resume</p>
        </div>
        <div class="resume-container">
            <div class="resume-content">
                <p>欢迎下载我的简历，了解更多关于我的教育背景、项目经历和技能。</p>
            </div>
            <div class="resume-links">
                <!-- 中文简历 -->
                <a href="assets/简历star.pdf" class="resume-btn" download>
                    <i class="fas fa-file-pdf"></i>
                    中文简历
                </a>
                <!-- 英文简历 -->
                <a href="assets/English.pdf" class="resume-btn secondary" download>
                    <i class="fas fa-file-pdf"></i>
                    English Resume
                </a>
            </div>
        </div>
    </div>
</section>
